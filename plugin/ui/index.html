<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark" data-api-base="/dsh-cot/api">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>思维链浏览器 · CoT Reader</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%90%8B%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <aside id="sidebar">
    <div class="brand">
      <div class="brand-mark">🐋</div>
      <div class="brand-text">
        <strong>思维链浏览器</strong>
        <span id="brand-sub">读取中…</span>
      </div>
      <button id="btn-refresh" class="icon-btn" title="重新扫描会话">⟳</button>
    </div>

    <div class="search-box">
      <input id="q" type="search" placeholder="搜索全部思维链…  Ctrl K" autocomplete="off" spellcheck="false">
      <label class="regex-toggle" title="正则表达式"><input id="regex" type="checkbox" hidden><span>.*</span></label>
    </div>
    <div class="filters">
      <select id="workspace-filter"><option value="">全部工作区</option></select>
      <select id="sort-mode">
        <option value="recent">最近活动</option>
        <option value="oldest">最早</option>
        <option value="biggest">思维链最多</option>
      </select>
    </div>

    <div class="sidebar-meta" id="sidebar-meta"></div>
    <div class="session-list" id="session-list"></div>
  </aside>

  <main id="main">
    <header id="topbar">
      <button id="btn-menu" class="ghost-btn mobile-only" title="会话列表">☰</button>
      <div class="crumb" id="crumb">选择一个会话</div>
      <div class="toolbar">
        <div class="view-switch" id="view-switch" role="tablist">
          <button data-view="original" title="只看原文">原文</button>
          <button data-view="bilingual" title="译文 + 原文">双语</button>
          <button data-view="translated" title="只看译文">译文</button>
        </div>
        <select id="model-select" title="翻译模型"></select>
        <label class="switch" title="打开会话时自动翻译可见条目">
          <input id="auto-translate" type="checkbox" checked>
          <span class="switch-track"><span class="switch-dot"></span></span>
          <span class="switch-label">自动翻译</span>
        </label>
        <button id="btn-translate-all" class="ghost-btn" title="翻译本会话全部条目">翻译全部</button>
        <button id="btn-export" class="ghost-btn" title="导出为 Markdown">导出</button>
      </div>
    </header>

    <div id="content">
      <div class="empty-state">
        <div class="empty-mark">🐋</div>
        <h1>翻一翻鲸娘的脑内小剧场</h1>
        <p>左边挑一个会话，这里会按「轮 → 步」展开每一步的思考。译文自动出现，原文随时可看。</p>
        <div class="empty-hint">Ctrl K 搜遍全部历史思维链 · 共 <b id="empty-count">0</b> 个会话</div>
      </div>
    </div>

    <footer id="statusbar">
      <span id="status-left">就绪</span>
      <span id="status-right"></span>
    </footer>
  </main>
</div>

<div id="toast" class="toast" hidden></div>
<script src="app.js" type="module"></script>
</body>
</html>
